<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Claudio 素材导入</title><link rel="stylesheet" href="./style.css" /></head><body>
<main><header><span>LOCAL TOOL / 4174</span><h1>Claudio 素材导入</h1><button id="choose-root" type="button">选择仓库目录</button></header>
<form id="import-form"><fieldset><legend>曲目信息</legend><label>Track ID<input name="id" required pattern="[a-z0-9-]+" /></label><label>歌名<input name="title" required /></label><label>歌手<input name="artist" required /></label><label>专辑<input name="album" required /></label><label class="wide">串词<textarea name="djText" required rows="4"></textarea></label><label>第一句人声起点（ms）<input name="vocalStartMs" type="number" min="1" required /></label></fieldset><fieldset><legend>本地文件</legend><label>歌曲片段<input name="music" type="file" accept="audio/*" required /></label><label>封面<input name="cover" type="file" accept="image/*" required /></label><label>预生成 DJ 音频<input name="djAudio" type="file" accept="audio/*" required /></label></fieldset><fieldset><legend>公开托管授权</legend><label>许可说明<input name="license" required /></label><label>来源 URL<input name="sourceUrl" type="url" required /></label><label>署名<input name="attribution" required /></label><label>核验日期<input name="verifiedAt" type="date" required /></label></fieldset><footer><output id="status">尚未选择仓库</output><button type="submit">写入素材</button></footer></form></main><script type="module" src="./importer.ts"></script></body></html>
